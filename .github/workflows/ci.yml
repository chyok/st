name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          # Latest Go, so builds get its security fixes; go.mod sets the minimum.
          go-version: stable

      # Also checks formatting and runs go vet; see .golangci.yml.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      # Builds every release target, as .goreleaser.yaml defines them.
      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
