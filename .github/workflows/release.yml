name: Release

# Publishing a release on GitHub builds the binaries for its tag and
# attaches them to the release, named like st-0.2.1-linux-x64.
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Build
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          make build-all VERSION="$version"
          cd builds
          for f in st-*; do mv "$f" "st-${version}-${f#st-}"; done
          sha256sum st-* > sha256sums.txt
          ls -l

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" builds/* --clobber
