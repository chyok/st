name: Release

# Publishing a release on GitHub builds the binaries for its tag with
# GoReleaser (.goreleaser.yaml) and attaches them to that release. The
# release's title and notes are left as written.
on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          # Latest Go, so builds get its security fixes; go.mod sets the minimum.
          go-version: stable

      - name: Test
        run: go test -race ./...

      - name: Build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir release
          jq -r '.[] | select(.type == "Binary" and (.name | startswith("st-"))) | "\(.path)\t\(.name)"' dist/artifacts.json |
            while IFS=$'\t' read -r src name; do cp "$src" "release/$name"; done
          cp dist/sha256sums.txt release/
          ls -l release
          gh release upload "$TAG" release/* --clobber
